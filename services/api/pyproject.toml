[project]
name = "genblaze-api"
version = "1.0.0"
description = "Genblaze Script Generation API"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "genblaze>=0.3.0",
    "openai>=1.0.0",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true
